services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SANDHI_MODE=demo
      - DATABASE_URL=sqlite:///sandhi.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
